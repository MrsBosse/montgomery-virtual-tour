      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 560px;
      line-height: 1.25;
      z-index: 10;
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      padding: 12px;
    }

    #overlayInner {
      display: flex;
      gap: 12px;
      height: calc(100vh - 24px);
    }

    #streetViewPanel {
      flex: 2;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #placardPanel {
      flex: 1;
      background: #101a2e;

      border-radius: 12px;
      padding: 16px;
      overflow: auto;
    }

    #placardTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #placardBody {
      font-size: 14px;
      line-height: 1.35;
    }

    .btnRow {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .danger {
      background: #7a2f2f;
      color: #fff;
    }
