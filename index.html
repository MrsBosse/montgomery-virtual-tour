<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Montgomery: Where American History Converges</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; }

    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 620px;
      line-height: 1.25;
      z-index: 10;
    }

    /* Overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      padding: 12px;
    }

    #overlayInner {
      display: flex;
      gap: 12px;
      height: calc(100vh - 24px);
    }

    #streetViewPanel {
      flex: 2;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #placardPanel {
      flex: 1;
      background: #101a2e;
      color: #fff;
      border-radius: 12px;
      padding: 16px;
      overflow: auto;
    }

    #placardTitle {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    #placardBody {
      font-size: 14px;
      line-height: 1.35;
    }

    .btnRow {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .danger {
      background: #7a2f2f;
      color: #fff;
    }
  </style>

  <script>
    // Street View embed URLs (Stops 1–6)
    const EMBED = {
      stop1: "https://www.google.com/maps/embed?pb=!4v1769809550377!6m8!1m7!1sCAoSF0NJSE0wb2dLRUlDQWdJQzRxb3luekFF!2m2!1d32.37705521568272!2d-86.300345924515!3f358.20204604683346!4f10.293438786272901!5f0.7820865974627469",
      stop2: "https://www.google.com/maps/embed?pb=!4v1769809730972!6m8!1m7!1sq5zSn5iwqfjHi73vcj2nwQ!2m2!1d32.37726860765179!2d-86.3090617218252!3f55.51995094136487!4f-12.266507852019544!5f0.7820865974627469",
      stop3: "https://www.google.com/maps/embed?pb=!4v1769809842696!6m8!1m7!1szcb7f9b98VENXTln1PvHdg!2m2!1d32.37634110654851!2d-86.31134196913585!3f307.1330858211799!4f4.064074151752919!5f0.7820865974627469",
      stop4: "https://www.google.com/maps/embed?pb=!4v1769809908088!6m8!1m7!1s6HG1OIYSHBy3HlHdTTmIUA!2m2!1d32.37760128260103!2d-86.30275987439865!3f172.3463!4f0!5f0.7820865974627469",
      stop5: "https://www.google.com/maps/embed?pb=!4v1769809961700!6m8!1m7!1sdx3VFrkyBZ3WHHtmc9mL8A!2m2!1d32.37756031673418!2d-86.3051193660069!3f336.35081739763206!4f-6.760502022971252!5f0.7820865974627469",
      stop6: "https://www.google.com/maps/embed?pb=!4v1769810003562!6m8!1m7!1sCAoSF0NJSE0wb2dLRUlDQWdJRFV1ODNtNUFF!2m2!1d32.37290701248501!2d-86.31324997851927!3f318.14355!4f0!5f0.7820865974627469"
    };

    const stops = [
      {
        title: "STOP 1 — Alabama State Capitol",
        embed: EMBED.stop1,
        body: `
          <b>Historical Read-Out:</b><br>
          A long-standing center of political power. Decisions made here shaped rights, enforcement, and resistance across eras.<br><br>
          <b>Look Around:</b><br>
          Notice elevation, visibility, and what the building overlooks.<br><br>
          <b>Reflect:</b><br>
          Who was power designed to serve here? Why might activists move toward this space?
        `
      },
      {
        title: "STOP 2 — Court Square",
        embed: EMBED.stop2,
        body: `
          <b>Historical Read-Out:</b><br>
          This area was historically tied to the buying and selling of enslaved people. Today it appears ordinary.<br><br>
          <b>Look Around:</b><br>
          What is marked? What is missing?<br><br>
          <b>Reflect:</b><br>
          Why are some histories harder to see in public spaces?
        `
      },
      {
        title: "STOP 3 — Rosa Parks Museum Area",
        embed: EMBED.stop3,
        body: `
          <b>Historical Read-Out:</b><br>
          Rosa Parks’s resistance helped spark the Montgomery Bus Boycott—showing how change can begin in everyday places.<br><br>
          <b>Look Around:</b><br>
          How ordinary does this setting feel?<br><br>
          <b>Reflect:</b><br>
          Why does everyday resistance matter?
        `
      },
      {
        title: "STOP 4 — Dexter Avenue King Memorial Baptist Church",
        embed: EMBED.stop4,
        body: `
          <b>Historical Read-Out:</b><br>
          A key organizing site during the boycott era—showing the power of community institutions.<br><br>
          <b>Look Around:</b><br>
          Notice proximity to government buildings.<br><br>
          <b>Reflect:</b><br>
          How can community spaces become political spaces?
        `
      },
      {
        title: "STOP 5 — Downtown Boycott Routes",
        embed: EMBED.stop5,
        body: `
          <b>Historical Read-Out:</b><br>
          Thousands walked or carpooled for months. Sustained protest required endurance and collective commitment.<br><br>
          <b>Look Around:</b><br>
          Estimate walking distances and route choices.<br><br>
          <b>Reflect:</b><br>
          What does geography reveal about the cost of protest?
        `
      },
      {
        title: "STOP 6 — National Memorial for Peace and Justice",
        embed: EMBED.stop6,
        body: `
          <b>Historical Read-Out:</b><br>
          This memorial confronts racial terror and the legacy of lynching in American history.<br><br>
          <b>Look Around:</b><br>
          How does the design shape emotion and reflection?<br><br>
          <b>Reflect:</b><br>
          Why might discomfort be necessary for remembrance?
        `
      }
    ];

    let currentStop = 0;

    function openStop(index) {
      currentStop = index;
      document.getElementById("placardTitle").innerText = stops[index].title;
      document.getElementById("placardBody").innerHTML = stops[index].body;
      document.getElementById("svFrame").src = stops[index].embed;
      document.getElementById("overlay").style.display = "block";
    }

    function closeOverlay() {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("svFrame").src = "";
    }

    function navStop(dir) {
      const next = Math.min(stops.length - 1, Math.max(0, currentStop + dir));
      openStop(next);
    }

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") closeOverlay();
    });
  </script>
</head>

<body>
  <div class="hint">
    <b>How to explore:</b> Use WASD or arrow keys to move. Click a station screen to open Street View + placard.
    <br><b>Tip:</b> Encourage students to rotate, zoom, and read before answering reflection questions.
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <div id="overlayInner">
      <div id="streetViewPanel">
        <iframe
          id="svFrame"
          width="100%"
          height="100%"
          style="border:0;"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>
      <div id="placardPanel">
        <div id="placardTitle"></div>
        <div id="placardBody"></div>
        <div class="btnRow">
          <button onclick="navStop(-1)">Back</button>
          <button onclick="navStop(1)">Next</button>
          <button class="danger" onclick="closeOverlay()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3D Hub -->
  <a-scene background="color: #cfe7ff">
    <!-- Assets -->
    <a-assets>
      <!-- IMPORTANT: upload montgomery-eji-map.jpg to the repo root -->
      <img id="montgomeryMap" src="montgomery-eji-map.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Lighting (brighter, less spooky) -->
    <a-entity light="type: ambient; intensity: 0.95"></a-entity>
    <a-entity light="type: directional; intensity: 0.85" position="2 6 3"></a-entity>

    <!-- Map floor -->
    <a-plane
      rotation="-90 0 0"
      width="40"
      height="28"
      material="src: #montgomeryMap; side: double"
      position="0 0 0">
    </a-plane>

    <!-- Platform border -->
    <a-ring
      position="0 0.02 0"
      rotation="-90 0 0"
      radius-inner="14"
      radius-outer="14.4"
      color="#ffffff">
    </a-ring>

    <!-- Camera -->
    <a-entity position="0 1.6 10">
      <a-camera wasd-controls="acceleration: 28" look-controls>
        <a-cursor></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Title board -->
    <a-entity position="0 2.4 -10">
      <a-plane width="10" height="1.6" color="#ffffff" opacity="0.85"></a-plane>
      <a-text value="Montgomery Virtual Tour Hub" align="center" color="#111"
              position="0 0.25 0.02" width="12"></a-text>
      <a-text value="Click a station to open Street View + placard" align="center" color="#111"
              position="0 -0.35 0.02" width="10"></a-text>
    </a-entity>

    <!-- Stations -->
    <!-- (These positions are symbolic; you can move them later to better match the map.) -->

    <a-entity position="-12 0 -3">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="1) Capitol" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#35528a" position="0 1.0 0.01" onclick="openStop(0)"></a-plane>
    </a-entity>

    <a-entity position="-6 0 -8">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="2) Court Square" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#6b4a2a" position="0 1.0 0.01" onclick="openStop(1)"></a-plane>
    </a-entity>

    <a-entity position="0 0 -10">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="3) Rosa Parks" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#2b6b4a" position="0 1.0 0.01" onclick="openStop(2)"></a-plane>
    </a-entity>

    <a-entity position="8 0 -7">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="4) Dexter Ave" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#7b2f5f" position="0 1.0 0.01" onclick="openStop(3)"></a-plane>
    </a-entity>

    <a-entity position="12 0 -1">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="5) Boycott Routes" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#875e2a" position="0 1.0 0.01" onclick="openStop(4)"></a-plane>
    </a-entity>

    <a-entity position="4 0 7">
      <a-cylinder height="0.6" radius="0.6" color="#26395f" position="0 0.3 0"></a-cylinder>
      <a-text value="6) Memorial" position="0 1.3 0" align="center" color="#111" width="4"></a-text>
      <a-plane width="2.6" height="1.5" color="#5b5b6f" position="0 1.0 0.01" onclick="openStop(5)"></a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
